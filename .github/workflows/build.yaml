name: Build Miranda Organizer

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - data
      - gh-pages

permissions:
  contents: write

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || \
          yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Build with official kivy/buildozer Docker image
        id: buildozer
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/main:/home/user/hostcwd" \
            -v "${{ github.workspace }}/.buildozer_global:/home/user/.buildozer" \
            -w /home/user/hostcwd \
            kivy/buildozer:latest \
            android debug
      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find main/bin -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

  release:
    name: Publish to tag release
    needs: build-android
    # Solo cuando el push es un tag (nunca en ramas ni pull requests).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
