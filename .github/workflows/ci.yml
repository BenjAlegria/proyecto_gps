name: EnRuta Ya CI
on:
  push:
    branches: ["feature/ajustesV2"]
  pull_request:
    branches: ["audit/fase-1"]

jobs:
  syntax-and-services:
    name: Compilar Python y probar servicios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Dependencias servicios
        run: python -m pip install --upgrade pip requests
      - name: Verificar sintaxis de toda la app
        run: python -m compileall -q main.py servicios tests tools
      - name: Ejecutar tests sin Kivy ni conexión a Firebase
        run: |
          python -m unittest tests.test_analitica tests.test_firebase_auth tests.test_firebase_rtdb tests.test_logica tests.test_servicios -v
      - name: Comprobar exportador vacío sin inventar mediciones
        run: |
          python tools/generar_resultados_mjv.py --eventos /tmp/no-existe.jsonl --salida /tmp/mjv-vacio
          grep -q "Sin datos" /tmp/mjv-vacio/RESULTADOS.md

  kivy-ui:
    name: Interfaz Kivy (Linux/Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KIVY_NO_ARGS: "1"
      KIVY_NO_FILELOG: "1"
      KIVY_GL_BACKEND: "gl"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar bibliotecas gráficas y xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1 libegl1 libmtdev1 libx11-6 libxext6 libxrender1 libcairo2-dev libgirepository-2.0-dev gir1.2-gtk-3.0 pkg-config libffi-dev libglib2.0-dev
      - name: Instalar Kivy y requisitos del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Ejecutar batería completa con pantalla virtual
        run: xvfb-run -a python -m unittest discover -s tests -v
